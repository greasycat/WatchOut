name: Release

# Push a tag like v1.2.0 → build the phone + watch APKs and publish a GitHub Release.
#   git tag v1.2.0 && git push origin v1.2.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release + upload APKs

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17" # Gradle 9.x requires JDK 17+

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APKs
        run: ./gradlew :mobile:assembleDebug :wear:assembleDebug

      # Self-signed debug APKs — installable directly, no keystore secrets.
      # ponytail: debug build; for Play/signed installs add a release signingConfig + keystore secrets.
      - name: Rename APKs with the tag
        run: |
          mv mobile/build/outputs/apk/debug/mobile-debug.apk "watchout-phone-${GITHUB_REF_NAME}.apk"
          mv wear/build/outputs/apk/debug/wear-debug.apk "watchout-watch-${GITHUB_REF_NAME}.apk"

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            watchout-phone-*.apk
            watchout-watch-*.apk
